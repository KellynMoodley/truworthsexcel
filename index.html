<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truworths Collections Summary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
    <div class="w-80 bg-white shadow-lg h-screen fixed left-0 top-0 overflow-y-auto">
        <div class="bg-blue-600 text-white p-6">
            <h2 class="text-xl font-bold">Account Profiles</h2>
            <input 
                type="file" 
                id="excelFile" 
                accept=".xlsx, .xls, .csv" 
                class="mt-2 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
            >
        </div>
        <div id="accountList" class="p-4 space-y-3">
            <!-- Accounts will be dynamically populated here -->
        </div>
    </div>

    <main class="ml-80 flex flex-grow p-10">
        <div class="bg-white shadow-md rounded-xl p-8 max-w-full mx-auto w-full">
            <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Account Details</h2>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="accountNumber">
                    Account Number
                </label>
                <input 
                    type="text" 
                    id="accountNumber" 
                    placeholder="Enter Account Number"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                >
            </div>
            
            <div id="accountDetails" class="mt-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Account details will be populated here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        let accountsData = [];

        // Custom headings mapping
        const fieldMappings = {
            'Account_no': 'Account Number',
            'Collections_Segment_Detail': 'The customer falls under ',
            'Last_Payment_Date': 'The last Payment Date of the customer was ',
            'Last_Payment_Amount': 'The Last Payment Amount of the customer account',
            'Balance': 'The Current Balance of the customers account',
            // Add more mappings as needed
        };

        // Function to check if a value might be an Excel date
        function isExcelDate(value) {
            return typeof value === 'number' && value > 1 && value < 50000;
        }

        // Function to format Excel date
        function formatExcelDate(excelDate) {
            if (!excelDate) return 'N/A';
            try {
                const date = new Date((excelDate - 25569) * 86400 * 1000);
                return date.toLocaleDateString('en-GB', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            } catch (error) {
                return excelDate;
            }
        }

        // Function to format value based on type
        function formatValue(key, value) {
            if (value === undefined || value === null || value === '') return 'N/A';
            
            if (key.toLowerCase().includes('date') && isExcelDate(value)) {
                return formatExcelDate(value);
            }
            
            // Add any other formatting rules here
            if (key.toLowerCase().includes('amount') || key.toLowerCase().includes('balance')) {
                return typeof value === 'number' ? 
                    value.toLocaleString('en-ZA', { style: 'currency', currency: 'ZAR' }) : 
                    value;
            }
            
            return value;
        }

        function showError(message) {
            const detailsElement = document.getElementById('accountDetails');
            detailsElement.innerHTML = `<div class="text-red-600 font-semibold">${message}</div>`;
        }

        function displayAccountDetails(accountNumber) {
            const detailsElement = document.getElementById('accountDetails');
            const account = accountsData.find(acc => acc.Account_no == accountNumber);

            if (!account) {
                showError('Account not found');
                return;
            }

            let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">';
            
            // Display fields in the order specified by fieldMappings
            for (const [excelField, displayHeading] of Object.entries(fieldMappings)) {
                if (account.hasOwnProperty(excelField)) {
                    const value = account[excelField];
                    const formattedValue = formatValue(excelField, value);

                    html += `
                        <div class="bg-gray-50 p-4 rounded-lg">
                            <h3 class="text-sm font-semibold text-gray-600 mb-1">${displayHeading}</h3>
                            <p class="text-gray-800">${formattedValue}</p>
                        </div>
                    `;
                }
            }

            // Display remaining fields that aren't in the mapping
            for (const [key, value] of Object.entries(account)) {
                if (!fieldMappings.hasOwnProperty(key)) {
                    const formattedValue = formatValue(key, value);
                    html += `
                        <div class="bg-gray-50 p-4 rounded-lg">
                            <h3 class="text-sm font-semibold text-gray-600 mb-1">${key}</h3>
                            <p class="text-gray-800">${formattedValue}</p>
                        </div>
                    `;
                }
            }

            html += '</div>';
            detailsElement.innerHTML = html;
        }

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                try {
                    const workbook = XLSX.read(event.target.result, { type: 'binary' });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];

                    accountsData = XLSX.utils.sheet_to_json(worksheet);

                    if (accountsData.length === 0) {
                        showError('No data found in the Excel file');
                        return;
                    }

                    const accountList = document.getElementById('accountList');
                    accountList.innerHTML = '';

                    accountsData.forEach(account => {
                        const accountDiv = document.createElement('div');
                        accountDiv.className = 'bg-gray-50 hover:bg-blue-100 p-3 rounded-lg cursor-pointer transition group';
                        accountDiv.setAttribute('onclick', `selectAccount('${account.Account_no}')`);
                        
                        accountDiv.innerHTML = `
                            <div class="flex justify-between items-center">
                                <div>
                                    <h3 class="font-semibold text-gray-800 group-hover:text-blue-700">${account.Collections_Segment_Detail || 'N/A'}</h3>
                                    <p class="text-sm text-gray-500 group-hover:text-blue-600">Account: ${account.Account_no}</p>
                                </div>
                            </div>
                        `;
                        
                        accountList.appendChild(accountDiv);
                    });
                } catch (error) {
                    showError(`Error reading Excel file: ${error.message}`);
                }
            };

            reader.onerror = function(error) {
                showError(`Error reading file: ${error.message}`);
            };

            reader.readAsBinaryString(file);
        });

        function selectAccount(accountId) {
            document.getElementById('accountNumber').value = accountId;
            displayAccountDetails(accountId);
        }

        document.getElementById('accountNumber').addEventListener('change', function() {
            displayAccountDetails(this.value);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truworths Collections Summary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
    <div class="w-80 bg-white shadow-lg h-screen fixed left-0 top-0 overflow-y-auto">
        <div class="bg-blue-600 text-white p-6">
            <h2 class="text-xl font-bold">Account Profiles</h2>
            <input 
                type="file" 
                id="excelFile" 
                accept=".xlsx, .xls, .csv" 
                class="mt-2 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
            >
        </div>
        <div id="accountList" class="p-4 space-y-3">
            <!-- Accounts will be dynamically populated here -->
        </div>
    </div>

    <main class="ml-80 flex flex-grow p-10">
        <div class="bg-white shadow-md rounded-xl p-8 max-w-full mx-auto w-full">
            <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Account Details</h2>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="accountNumber">
                    Account Number
                </label>
                <input 
                    type="text" 
                    id="accountNumber" 
                    placeholder="Enter Account Number"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                >
            </div>
            
            <div id="accountDetails" class="mt-8 space-y-8">
                <!-- Details will be populated here -->
            </div>
        </div>
    </main>

    <script>
        let accountsData = [];

        // Primary information fields
        const primaryFields = {
            'Account_no': 'Account Number',
            'Collections_Segment_Detail': 'The customer payment behavior falls under ',
            'Date_Collections': 'The date when the customer’s account was flagged for collections was',  
            'Date_Last_Payment': 'The last date when a payment was made on the account was',  
            'Last_Payment_Amount': 'The most recent payment amount made by the customer was',
            'Payment_Due_Date': 'The due date for the customer’s next scheduled payment is', 
            'Salary_DayofMonth': 'The day of the month when the customer receives their salary is ',
            'Current_Balance': 'The current outstanding balance on the customer’s account is',   
            'instalment': 'The fixed amount the customer required to pay at each payment interval is',  
            'Total_amount_due': 'The total outstanding amount that the customer must pay is',  
            'Number_Broken_PTP': 'The number of times the customer has broken a "Promise to Pay" commitment is',  
            'CycleDue_Current': 'The level of delinquency at the time of the collections call is ',  
            'Pref_Payment_Method_Desc': 'The customer’s most frequently used payment method is',  
            'debit_order_present': 'Is the debit order active on the account? (Y = Yes, N = No)',  
            'PTP_Ind': 'Did the last call result in a "Promise to Pay" commitment from the customer? (1 = Yes, 0 = No).'  
}
        };

        // Secondary information fields
        const secondaryFields = {
            'Call_Datetime': 'The last date and time when a collections call was made.',  
    'Call_Length': 'The duration of the collections call.' 
    'COMPANY': 'The store of preference company associated with the account is,  
    'Customer_Bank_Name': 'Name of the customer’s bank. If unavailable, it will be marked as "Null."',
    'Date_Opened': 'The date the account was opened was',  
    'Month_on_Book': 'The age of the customer’s account, categorized in specific time bands.',  
    'Date_Last_Purchased': 'The last date the customer made a purchase using the account.',  
    'Collections_Segment': 'The customer’s classification within the collections process (e.g., Payer, Engager, Ignorer, Worst).',  
    'bucket_definition': 'Indicates whether the account’s delinquency status has improved, remained the same, or worsened compared to the previous month.',  
    'CycleDue_Billing': 'The level of delinquency at the time of billing, based on predefined delinquency mappings.',  
    'CycleDue_Hist_1_24M': 'The customer’s delinquency history over the past 24 months, based on predefined delinquency mappings.',  
    'Payment_Recency_Months': 'The number of months since the customer’s last payment.',  
    'FPD_Indicator': 'Indicates whether the account is a First Payment Defaulter (1 = Yes, 0 = No).'
}


            
        };

        function isExcelDate(value) {
            return typeof value === 'number' && value > 1 && value < 50000;
        }

        function formatExcelDate(excelDate) {
            if (!excelDate) return 'N/A';
            try {
                const date = new Date((excelDate - 25569) * 86400 * 1000);
                return date.toLocaleDateString('en-GB', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            } catch (error) {
                return excelDate;
            }
        }

        function formatValue(key, value) {
            if (value === undefined || value === null || value === '') return 'N/A';
            
            if (key.toLowerCase().includes('date') && isExcelDate(value)) {
                return formatExcelDate(value);
            }
            
            if (key.toLowerCase().includes('amount') || key.toLowerCase().includes('balance')) {
                return typeof value === 'number' ? 
                    value.toLocaleString('en-ZA', { style: 'currency', currency: 'ZAR' }) : 
                    value;
            }
            
            return value;
        }

        function showError(message) {
            const detailsElement = document.getElementById('accountDetails');
            detailsElement.innerHTML = `<div class="text-red-600 font-semibold">${message}</div>`;
        }

        function displayAccountSection(account, fields, title, containerClass) {
            let html = `
                <div class="${containerClass}">
                    <h3 class="text-xl font-semibold mb-4 text-gray-700">${title}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            `;
            
            for (const [excelField, displayHeading] of Object.entries(fields)) {
                if (account.hasOwnProperty(excelField)) {
                    const value = account[excelField];
                    const formattedValue = formatValue(excelField, value);

                    html += `
                        <div class="bg-gray-50 p-4 rounded-lg">
                            <h3 class="text-sm font-semibold text-gray-600 mb-1">${displayHeading}</h3>
                            <p class="text-gray-800">${formattedValue}</p>
                        </div>
                    `;
                }
            }

            html += '</div></div>';
            return html;
        }

        function displayAccountDetails(accountNumber) {
            const detailsElement = document.getElementById('accountDetails');
            const account = accountsData.find(acc => acc.Account_no == accountNumber);

            if (!account) {
                showError('Account not found');
                return;
            }

            let html = '';
            
            // Primary Information Section
            html += displayAccountSection(account, primaryFields, 'Primary information', 'mb-8 p-6 bg-white border border-gray-200 rounded-lg');
            
            // Secondary Information Section
            html += displayAccountSection(account, secondaryFields, 'Secondary Information', 'p-6 bg-white border border-gray-200 rounded-lg');

            // Display remaining fields in Secondary section
            let remainingFieldsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">';
            let hasRemainingFields = false;

            for (const [key, value] of Object.entries(account)) {
                if (!primaryFields.hasOwnProperty(key) && !secondaryFields.hasOwnProperty(key)) {
                    hasRemainingFields = true;
                    const formattedValue = formatValue(key, value);
                    remainingFieldsHtml += `
                        <div class="bg-gray-50 p-4 rounded-lg">
                            <h3 class="text-sm font-semibold text-gray-600 mb-1">${key}</h3>
                            <p class="text-gray-800">${formattedValue}</p>
                        </div>
                    `;
                }
            }
            remainingFieldsHtml += '</div>';

            if (hasRemainingFields) {
                html += `<div class="mt-8 p-6 bg-white border border-gray-200 rounded-lg">
                    <h3 class="text-xl font-semibold mb-4 text-gray-700">Additional Information</h3>
                    ${remainingFieldsHtml}
                </div>`;
            }

            detailsElement.innerHTML = html;
        }

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                try {
                    const workbook = XLSX.read(event.target.result, { type: 'binary' });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];

                    accountsData = XLSX.utils.sheet_to_json(worksheet);

                    if (accountsData.length === 0) {
                        showError('No data found in the Excel file');
                        return;
                    }

                    const accountList = document.getElementById('accountList');
                    accountList.innerHTML = '';

                    accountsData.forEach(account => {
                        const accountDiv = document.createElement('div');
                        accountDiv.className = 'bg-gray-50 hover:bg-blue-100 p-3 rounded-lg cursor-pointer transition group';
                        accountDiv.setAttribute('onclick', `selectAccount('${account.Account_no}')`);
                        
                        accountDiv.innerHTML = `
                            <div class="flex justify-between items-center">
                                <div>
                                    <h3 class="font-semibold text-gray-800 group-hover:text-blue-700">${account.Collections_Segment_Detail || 'N/A'}</h3>
                                    <p class="text-sm text-gray-500 group-hover:text-blue-600">Account: ${account.Account_no}</p>
                                </div>
                            </div>
                        `;
                        
                        accountList.appendChild(accountDiv);
                    });
                } catch (error) {
                    showError(`Error reading Excel file: ${error.message}`);
                }
            };

            reader.onerror = function(error) {
                showError(`Error reading file: ${error.message}`);
            };

            reader.readAsBinaryString(file);
        });

        function selectAccount(accountId) {
            document.getElementById('accountNumber').value = accountId;
            displayAccountDetails(accountId);
        }

        document.getElementById('accountNumber').addEventListener('change', function() {
            displayAccountDetails(this.value);
        });
    </script>
</body>
</html>
